<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img" aria-labelledby="title description">
  <title id="title">LinkWisp architecture</title>
  <desc id="description">The browser extension stores private history locally, sends authenticated requests to a Cloudflare Worker backed by D1, and public short links redirect through the Worker to destination websites.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F7F2"/>
      <stop offset="1" stop-color="#E4F3E9"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#215F42"/>
      <stop offset="1" stop-color="#174932"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#153F2D" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#2F7556"/>
    </marker>
    <style>
      .title { font: 700 31px "Segoe UI", Arial, sans-serif; fill: #123D2B; }
      .subtitle { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #557064; }
      .section { font: 700 14px "Segoe UI", Arial, sans-serif; letter-spacing: 1.4px; fill: #397056; }
      .card-title { font: 700 20px "Segoe UI", Arial, sans-serif; fill: #123D2B; }
      .card-title-light { font: 700 20px "Segoe UI", Arial, sans-serif; fill: #FFFFFF; }
      .body { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #536B61; }
      .body-light { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #DDF2E5; }
      .label { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #2F7556; }
      .small { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #60766D; }
    </style>
  </defs>

  <rect width="1280" height="610" rx="30" fill="url(#background)"/>
  <text x="56" y="58" class="title">Local control. Online redirects.</text>
  <text x="56" y="86" class="subtitle">LinkWisp separates private browser state from the minimum mapping required to resolve a public short link.</text>

  <rect x="42" y="116" width="354" height="430" rx="24" fill="#FFFFFF" stroke="#C5DDD0" filter="url(#shadow)"/>
  <text x="70" y="150" class="section">ON YOUR DEVICE</text>

  <rect x="70" y="176" width="298" height="142" rx="20" fill="url(#primary)"/>
  <circle cx="104" cy="214" r="18" fill="#8DE0B2"/>
  <path d="M94 214c0-7 5-12 12-12h7c7 0 12 5 12 12s-5 12-12 12h-7c-7 0-12-5-12-12Zm11 0c0 3 2 5 5 5h3c3 0 5-2 5-5s-2-5-5-5h-3c-3 0-5 2-5 5Z" fill="#215F42"/>
  <text x="136" y="209" class="card-title-light">Browser extension</text>
  <text x="136" y="235" class="body-light">Create, edit and manage links</text>
  <text x="98" y="268" class="body-light">Clean URLs · Generate QR</text>
  <text x="98" y="292" class="body-light">Copy and share</text>

  <path d="M219 318V350" stroke="#2F7556" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="70" y="360" width="298" height="130" rx="18" fill="#EEF7F1" stroke="#B7D6C4"/>
  <text x="96" y="397" class="card-title">Browser-local storage</text>
  <text x="96" y="426" class="body">History · Favorites · Preferences</text>
  <text x="96" y="451" class="body">Per-link management keys</text>
  <rect x="96" y="464" width="127" height="6" rx="3" fill="#8DE0B2"/>

  <rect x="444" y="116" width="478" height="430" rx="24" fill="#FFFFFF" stroke="#C5DDD0" filter="url(#shadow)"/>
  <text x="472" y="150" class="section">OWNER-CONTROLLED CLOUDFLARE SERVICE</text>

  <rect x="472" y="176" width="422" height="154" rx="20" fill="#E8F4EC" stroke="#A9CFB8"/>
  <text x="502" y="216" class="card-title">Worker API + redirect router</text>
  <text x="502" y="247" class="body">Authenticate creation and management</text>
  <text x="502" y="273" class="body">Resolve /:code · Redirect or render status</text>
  <rect x="502" y="291" width="164" height="8" rx="4" fill="#2F7556"/>

  <path d="M683 330V358" stroke="#2F7556" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="472" y="368" width="422" height="122" rx="18" fill="#FFFFFF" stroke="#B7D6C4"/>
  <text x="502" y="406" class="card-title">D1 redirect mappings</text>
  <text x="502" y="435" class="body">Code · Destination · Expiration · State</text>
  <text x="502" y="461" class="body">Hashed per-link management token</text>

  <path d="M396 240H444" stroke="#2F7556" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="386" y="192" width="70" height="34" rx="17" fill="#F4F7F2"/>
  <text x="421" y="214" text-anchor="middle" class="label">HTTPS</text>

  <rect x="970" y="116" width="268" height="430" rx="24" fill="#FFFFFF" stroke="#C5DDD0" filter="url(#shadow)"/>
  <text x="998" y="150" class="section">PUBLIC WEB</text>

  <rect x="998" y="176" width="212" height="112" rx="18" fill="#EEF7F1" stroke="#B7D6C4"/>
  <text x="1024" y="215" class="card-title">Short-link visitor</text>
  <text x="1024" y="244" class="body">Any browser or device</text>
  <text x="1024" y="267" class="small">GET /your-code</text>

  <path d="M998 244H922" stroke="#2F7556" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M922 302H970" stroke="#2F7556" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="946" y="290" text-anchor="middle" class="label">302</text>

  <rect x="998" y="316" width="212" height="112" rx="18" fill="url(#primary)"/>
  <text x="1024" y="357" class="card-title-light">Destination site</text>
  <text x="1024" y="386" class="body-light">Or branded unavailable</text>
  <text x="1024" y="410" class="body-light">link page</text>

  <rect x="998" y="454" width="212" height="50" rx="14" fill="#FFF7DC" stroke="#E7D28A"/>
  <text x="1104" y="475" text-anchor="middle" class="small">No extension required</text>
  <text x="1104" y="493" text-anchor="middle" class="small">to open a short link</text>

  <text x="56" y="580" class="small">Privacy boundary: local history never enters D1 · Production credentials never enter the repository or release ZIP</text>
</svg>
